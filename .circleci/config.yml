version: 2.1
jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-
      - run:
          name: Maven compile and package
          command: mvn -B -ntp clean package
      - run:
          name: Verify plugin artifact
          command: |
            VERSION=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -1)
            test -n "$VERSION"
            JAR="target/HeavenlySwordDescent-${VERSION}.jar"
            test -f "$JAR"
            jar tf "$JAR" | grep -q 'plugin.yml'
      - save_cache:
          key: maven-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
      - store_artifacts:
          path: target
workflows:
  build-and-test:
    jobs:
      - build
