name: Build HeavenlySwordDescent Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify Java version
        run: java -version
      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"
      - name: Build with Maven
        run: mvn -B -ntp clean package
      - name: Verify plugin JAR
        shell: bash
        run: |
          JAR="target/HeavenlySwordDescent-${{ steps.project.outputs.version }}.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -Fx 'plugin.yml'
          jar tf "$JAR" | grep -q 'com/hahhah20/heavenlysworddescent/HeavenlySwordDescentPlugin.class'
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeavenlySwordDescent-${{ steps.project.outputs.version }}
          path: target/HeavenlySwordDescent-${{ steps.project.outputs.version }}.jar
          if-no-files-found: error
