name: Build HeavenlySwordDescent Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Java version
        run: java -version

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Verify plugin JAR
        shell: bash
        run: |
          test -f target/HeavenlySwordDescent-2.1.0.jar
          jar tf target/HeavenlySwordDescent-2.1.0.jar | grep -Fx 'plugin.yml'
          jar tf target/HeavenlySwordDescent-2.1.0.jar | grep -q 'com/hahhah20/heavenlysworddescent/HeavenlySwordDescentPlugin.class'

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeavenlySwordDescent-2.1.0
          path: target/HeavenlySwordDescent-2.1.0.jar
          if-no-files-found: error
